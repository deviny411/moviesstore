{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <h2>Report Review</h2>
        <div class="container mt-4">
          <div class="row justify-content-center">
            <div class="col-12">
              <div class="card shadow p-3 mb-4 rounded">
                <div class="card-body">
                  <b class="text-start"> {{template_data.review.comment }}</b>
                  <br /><br />
                  <form method="POST">
                    {% csrf_token %}
                    <p>
                      <label for="comment">Reason:</label>
                      <textarea name="comment" required class="form-control" id="comment"></textarea>
                    </p>
                    <div class="text-center">
                      <button type="submit" class="btn btn-danger">
                        Report
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
    </div>
  </div>
</div>
{% endblock content %}
